<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>__MSG_optionsTitle__</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>__MSG_optionsTitle__</h1>
      <p class="lead">__MSG_optionsLead__</p>

      <label class="option" for="enabled">
        <input id="enabled" type="checkbox" checked />
        <span>
          <span class="option-title">__MSG_optionEnabledTitle__</span>
          <span class="option-help">__MSG_optionEnabledHelp__</span>
        </span>
      </label>

      <div class="option delay">
        <label class="option-title" for="delay">__MSG_optionDelayTitle__</label>
        <input
          id="delay"
          type="range"
          min="5"
          max="30"
          step="1"
          value="10"
          aria-describedby="delay-readout"
        />
        <p class="option-help" id="delay-readout"></p>
      </div>

      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
